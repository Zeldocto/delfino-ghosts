<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Delfino Ghosts</title>
    <meta
      name="description"
      content="A community archive for Super Mario Sunshine ghosts recorded with the Moonshine practice mod."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the stored theme before first paint so dark never flashes white.
      (function () {
        try {
          var stored = localStorage.getItem('delfino-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <script>
      // Companion to public/404.html: restores the real path after GitHub Pages
      // has served the fallback document for a deep link.
      (function () {
        var redirect = sessionStorage.getItem('delfino:redirect')
        if (redirect) {
          sessionStorage.removeItem('delfino:redirect')
          if (redirect !== window.location.href) history.replaceState(null, '', redirect)
        }
      })()
    </script>
  </head>
  <body style="background:#0c1113">
    <div id="root">
      <!-- Replaced by React on mount. If this text is still here, the app
           bundle did not load or did not run - check the browser console. -->
      <div style="font-family: ui-monospace, monospace; color: #869799; padding: 40px 20px; max-width: 620px; margin: 0 auto">
        <p style="color: #d8dfdd">Delfino Ghosts</p>
        <p>Loading the archive&hellip;</p>
        <noscript>
          <p>This site needs JavaScript. The archive is a client-side application.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
