name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs supersede rather than interleave.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Both values are public client configuration. They are kept in
          # repository *variables* rather than the source tree only so that a
          # fork builds against its own Supabase project — not because the anon
          # key is a secret. The service_role key must never appear here.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          # Serves the app from /<repository-name>/, so renaming the repo works.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Verify Pages assets
        # public/404.html is the SPA fallback GitHub Pages serves for deep links
        # such as /profile/theo; .nojekyll stops Jekyll eating _-prefixed files.
        run: |
          test -f dist/404.html || { echo "404.html missing from build"; exit 1; }
          test -f dist/.nojekyll || touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
